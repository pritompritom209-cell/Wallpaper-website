<!DOCTYPE html>
<html>
<head>
  <title>WallPix - Free Wallpapers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    header {
      text-align: center;
      padding: 30px;
      background: #020617;
    }

    h1 {
      color: #38bdf8;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .search {
      padding: 15px;
      width: 80%;
      max-width: 500px;
      border-radius: 10px;
      border: none;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .card h3 {
      padding: 10px 15px;
    }

    .download {
      display: block;
      margin: 15px;
      padding: 12px;
      text-align: center;
      background: #38bdf8;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>WallPix</h1>
  <p>Free Beautiful Wallpapers</p>
</header>

<div class="hero">
  <h2>Find Your Wallpaper</h2>
  <input class="search" placeholder="Search wallpapers...">
</div>

<div class="gallery">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7">
    <h3>Nature Wallpaper</h3>
    <a class="download"
       href="https://images.unsplash.com/photo-1500534623283-312aade485b7"
       target="_blank">
       Download
    </a>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e">
    <h3>Mountain Wallpaper</h3>
    <a class="download"
       href="https://images.unsplash.com/photo-1493246507139-91e8fad9978e"
       target="_blank">
       Download
    </a>
  </div>

</div>

</body>
</html>
